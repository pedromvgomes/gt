version: 2

project_name: gt

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      gt_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

# gt update verifies checksums.txt.minisig against the key embedded from
# internal/selfupdate/minisign.pub before it trusts any checksum. The key is
# unencrypted (minisign -G -W), so signing never prompts; release.yml writes
# it to MINISIGN_KEY_FILE from the MINISIGN_KEY secret.
signs:
  - artifacts: checksum
    cmd: minisign
    args: ["-S", "-s", "{{ .Env.MINISIGN_KEY_FILE }}", "-m", "${artifact}", "-x", "${signature}"]
    signature: "${artifact}.minisig"

changelog:
  use: git
  groups:
    - title: Features
      regexp: "^.*feat(\\(.+\\))?:.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix(\\(.+\\))?:.*$"
      order: 1
    - title: Other
      order: 999

release:
  footer: |
    **Full Changelog**: https://github.com/pedromvgomes/gt/compare/{{ .PreviousTag }}...{{ .Tag }}
