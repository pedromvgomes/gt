name: gt bulwark

# Compatibility shim, not the gate itself — that is reusable-lydite.yml now.
#
# Every governed repository not yet re-synced still has
# `uses: pedromvgomes/gt/.github/workflows/reusable-bulwark.yml@v1` committed
# in its own ci-orchestration.yml, pinned to the moving v1 tag. The weekly
# `gt sync` job cannot repair that itself — GITHUB_TOKEN may not write
# `.github/workflows/**` — so a consumer stays on this path until someone runs
# `gt repo fleet sync` locally. Renaming the file outright the moment v1 moves
# past this commit would break every one of those repositories at once.
#
# So this file stays, forwarding unchanged, until the next major version. Only
# then may it be deleted — a v2 tag is what every consumer repoints to by
# hand, the same event that already requires touching their own files.

on:
  workflow_call:
    inputs:
      dir:
        type: string
        default: "."
      coverage:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lydite:
    name: lydite
    permissions:
      contents: read
      statuses: write
      id-token: write
      pull-requests: write
    # Fully qualified, not `./...`: this file is called by a foreign
    # repository, and whether a relative `uses:` inside a chained reusable
    # workflow resolves against the caller or against gt is exactly the
    # ambiguity docs/pipeline-design.md already flags as inconsistently
    # documented upstream. An explicit external ref has no such question —
    # it always resolves in gt's own repository, at this tag, the same
    # deliberately-moving `@v1` the other reusable-workflow calls track.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: pedromvgomes/gt/.github/workflows/reusable-lydite.yml@v1
    with:
      dir: ${{ inputs.dir }}
      coverage: ${{ inputs.coverage }}
