name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's `toolchain` line, not restated here. The old
          # `go-version: "1.26"` resolved to 1.26.0 and stayed there, so the
          # build silently kept a toolchain with 18 stdlib advisories open
          # against it.
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

      # The reusable workflows under .github/workflows/reusable-*.yml are never
      # parsed by this repository's own CI: nothing here calls them, and a
      # consumer only finds out at run time, when GitHub rejects the whole
      # workflow and takes every caller down with it.
      #
      # That is not hypothetical. `secrets` is not a context a step-level `if:`
      # may read, and shipping one broke Dependabot auto-merge in every governed
      # repository at once — including the ones that had not opted into the
      # feature the expression guarded, because the failure is at parse time.
      #
      # actionlint parses them here instead, and catches exactly that class:
      # unknown contexts, bad expressions, and shellcheck over every `run:`.
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: Test
        run: go test ./tests/... -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
