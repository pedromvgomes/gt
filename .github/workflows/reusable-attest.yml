name: gt attest

# Answers "has this exact tree already passed the gate?"
#
# GitHub tests refs/pull/N/merge for pull_request events — the merged result of
# the PR into its base — and a squash merge produces a commit with that same
# tree. So the tree ci-gate validated and the tree that lands on the default
# branch are directly comparable, which turns "was this tested against what it
# merged into?" from a policy into a fact.
#
# This workflow only reads. ci-gate is what writes the attestation, on success,
# for whatever tree it just validated.
#
# It fails safe in every direction: a missing attestation, an unreadable one, or
# a mismatch all report validated=false, which runs the pipeline. The only way
# to skip work is a positive match.

on:
  workflow_call:
    inputs:
      require:
        description: >-
          Fail when the tree carries no passing attestation. Delivery sets this:
          refusing to publish an unvalidated tree is the point.
        type: boolean
        default: false
    outputs:
      validated:
        description: '"true" when this tree already carries a passing attestation.'
        value: ${{ jobs.attest.outputs.validated }}

permissions:
  contents: read

jobs:
  attest:
    name: attest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    outputs:
      validated: ${{ steps.check.outputs.validated }}
      tree: ${{ steps.check.outputs.tree }}
      run_url: ${{ steps.check.outputs.run_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for a passing attestation
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE: ${{ inputs.require }}
        run: |
          set -euo pipefail

          # Which commit carries the attestations to check. For a pull_request
          # that is the PR head, where ci-gate records them; elsewhere it is the
          # commit being built.
          lookup="$GITHUB_SHA"
          if [[ "$EVENT" == "pull_request" ]]; then
            lookup="$HEAD_SHA"
          fi

          tree=$(git rev-parse "HEAD^{tree}")
          echo "tree in hand: ${tree}"

          # Collect every tree any attestation vouches for. Two places carry
          # them: the commit itself, once a previous default-branch run
          # recorded one, and the head of the PR that produced this commit,
          # where ci-gate recorded it first.
          # Each line is "<tree> <run url>", so a match can name the run that
          # did the work rather than just asserting one exists.
          attested=$(gh api "repos/${REPO}/commits/${lookup}/statuses" --paginate \
            --jq '.[] | select(.context == "gt/validated-tree" and .state == "success")
                      | "\(.description) \(.target_url // "")"' || true)

          if [[ "$EVENT" != "pull_request" ]]; then
            prs=$(gh api "repos/${REPO}/commits/${lookup}/pulls" \
              --jq '.[].head.sha' 2>/dev/null || true)
            for head in $prs; do
              more=$(gh api "repos/${REPO}/commits/${head}/statuses" --paginate \
                --jq '.[] | select(.context == "gt/validated-tree" and .state == "success")
                          | "\(.description) \(.target_url // "")"' || true)
              attested="${attested}"$'\n'"${more}"
            done
          fi

          validated=false
          run_url=""
          while read -r candidate url; do
            [[ -z "$candidate" ]] && continue
            if [[ "$candidate" == "$tree" ]]; then
              validated=true
              run_url="$url"
              break
            fi
          done <<< "$attested"

          {
            echo "validated=${validated}"
            echo "tree=${tree}"
            echo "run_url=${run_url}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$validated" == "true" ]]; then
            echo "✅ this tree already passed the gate"
            {
              echo "### Pipeline skipped — this tree already passed"
              echo
              echo "Tree \`${tree}\` was validated by ${run_url:-an earlier run}."
              echo "Skipped is not unrun: the validated tree and this one are identical."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$REQUIRE" == "true" ]]; then
            echo "::error::no passing gt/validated-tree attestation for tree ${tree}"
            echo "Nothing may be published from a tree that has not passed the gate."
            echo "Either the tag points at a commit CI never validated, or the tree"
            echo "changed after it was validated. Push the commit through CI first."
            exit 1
          fi

          echo "no attestation for this tree — the pipeline will run"

      # Skipped jobs look identical whether the pipeline decided the work was
      # unnecessary or something quietly went wrong. On a pull request that
      # ambiguity lands on a reviewer, so say it out loud where they are already
      # looking, and take it back the moment it stops being true.
      #
      # continue-on-error because this is an explanation, not a gate. GitHub
      # issues a read-only token for Dependabot pull requests whatever the
      # workflow asks for, so the comment cannot be written there at all — and
      # failing a run over a missing note would be far worse than the note.
      - name: Say why the pipeline was skipped
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VALIDATED: ${{ steps.check.outputs.validated }}
          TREE: ${{ steps.check.outputs.tree }}
          RUN_URL: ${{ steps.check.outputs.run_url }}
        run: |
          set -euo pipefail
          marker='<!-- gt-attest -->'

          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1 || true)

          # Not validated means the pipeline is running for real, so any note
          # claiming otherwise is now false. Remove it rather than leave a stale
          # explanation sitting next to a live run.
          if [[ "$VALIDATED" != "true" ]]; then
            if [[ -n "$existing" ]]; then
              gh api --method DELETE "repos/${REPO}/issues/comments/${existing}" >/dev/null
              echo "removed the stale skip note; this tree is being validated now"
            else
              echo "nothing to say: this tree is being validated now"
            fi
            exit 0
          fi

          where="an earlier run"
          if [[ -n "$RUN_URL" ]]; then
            where="[that run](${RUN_URL})"
          fi

          # printf rather than a heredoc: a heredoc body has to sit at column 0,
          # which is not valid inside this block scalar.
          body=$(printf '%s\n' \
            "${marker}" \
            '### Pipeline skipped — this tree already passed' \
            '' \
            "Every stage was skipped because this exact tree already passed \`ci-gate\` in ${where}." \
            '' \
            '```' \
            "tree ${TREE}" \
            '```' \
            '' \
            '**Skipped is not unrun.** The validated tree and the tree in this pull' \
            'request are byte-identical, so running again would test the same content' \
            'twice. Editing the title or description does not change the tree, which is' \
            'why those edits end up here.' \
            '' \
            'Push a commit, or let the base branch move, and the tree changes: the' \
            'attestation stops matching, the full pipeline runs, and this comment is' \
            'removed.')

          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
            echo "updated the skip note"
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null
            echo "posted the skip note"
          fi
