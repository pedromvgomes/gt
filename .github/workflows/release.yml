name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # From go.mod's `toolchain` line, not restated here. The old
          # `go-version: "1.26"` resolved to 1.26.0 and stayed there, so the
          # build silently kept a toolchain with 18 stdlib advisories open
          # against it.
          go-version-file: go.mod
      - name: Detect release notes file
        id: notes
        run: |
          tag="${GITHUB_REF_NAME:-}"
          file="docs/releases/${tag}.md"
          if [ -n "$tag" ] && [ -f "$file" ]; then
            echo "file=$file" >>"$GITHUB_OUTPUT"
            echo "Using release notes from $file"
          else
            echo "No release notes file found at $file; goreleaser will generate the changelog"
          fi
      - name: Release
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          args: release --clean ${{ steps.notes.outputs.file && format('--release-notes={0}', steps.notes.outputs.file) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Governed repositories pin gt's reusable workflows to a moving major tag
      # (v0, v1, ...) rather than a SHA, so gate and sync logic reaches them
      # without editing any file — which matters because GITHUB_TOKEN cannot
      # write .github/workflows/**.
      #
      # This step is load-bearing. If it is ever skipped, every governed repo
      # silently freezes on the old logic with NO drift signal: their caller
      # files are still byte-identical, so `gt repo check` reports compliant.
      # That is why it verifies the move rather than assuming it worked.
      - name: Move the major version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          major="${TAG%%.*}"   # v1.2.3 -> v1
          if [[ ! "$major" =~ ^v[0-9]+$ ]]; then
            echo "::error::could not derive a major tag from ${TAG}"
            exit 1
          fi

          echo "Moving ${major} -> ${TAG} ($(git rev-parse --short "$TAG"))"
          git tag -f "$major" "$TAG"
          git push --force origin "refs/tags/${major}"

          # Confirm the remote actually advanced; a silent no-op here is the
          # failure mode this whole step exists to prevent.
          remote_sha=$(git ls-remote origin "refs/tags/${major}" | cut -f1)
          expected_sha=$(git rev-parse "${major}")
          if [[ "$remote_sha" != "$expected_sha" ]]; then
            echo "::error::${major} did not advance on the remote (got ${remote_sha}, want ${expected_sha})"
            exit 1
          fi
          echo "${major} now points at ${TAG}." >> "$GITHUB_STEP_SUMMARY"
