name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
      - name: Detect release notes file
        id: notes
        run: |
          tag="${GITHUB_REF_NAME:-}"
          file="docs/releases/${tag}.md"
          if [ -n "$tag" ] && [ -f "$file" ]; then
            echo "file=$file" >>"$GITHUB_OUTPUT"
            echo "Using release notes from $file"
          else
            echo "No release notes file found at $file; goreleaser will generate the changelog"
          fi
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean ${{ steps.notes.outputs.file && format('--release-notes={0}', steps.notes.outputs.file) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
