# release — a release is the merge of its notes.
#
# A pull request that adds docs/releases/vX.Y.Z.md and merges to main releases
# that version: this workflow tags the merge commit, runs GoReleaser and moves
# the major tag. Nobody pushes a tag. There is no tag trigger, because a tag
# pushed with GITHUB_TOKEN starts no workflow, so everything downstream of the
# tag happens in this run, and a tag pushed by hand releases nothing.
#
# Every push to main sweeps. `plan` reads the pushed commit and the remote's
# tags and releases (.github/scripts/release/plan.sh) and picks one of three
# modes: `release` for notes whose tag does not exist, `finish` for a latest tag
# that has no GitHub Release (a run that failed after tagging), `none`. A
# failure rolls nothing back; the next push or a `workflow_dispatch` sweeps
# again and finishes what is left.
#
# Three jobs, and the seams between them are safety properties. `plan` and
# `verify` hold a read-only token and check out without persisting it; `verify`
# is the only job that runs repository code besides the build. `release` holds
# `contents: write`, and it is the only one that can push the tag. It is also
# the only one in the `release` environment, whose MINISIGN_KEY secret signs
# checksums.txt and which admits main alone, so plan and verify hold no secret.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run verify alone, writing nothing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One sweep at a time, and never cancel one in flight: a cancelled run can leave
# a version tagged but unreleased. A run replaced while queued is never missed,
# because the newer run sweeps everything it would have.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: The ref is main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::${REF} is not refs/heads/main; only main is released"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The tags are listed before they are fetched: a tag pushed in between is
      # fetched but not listed, which is harmless, and the next run sees it.
      - name: List the tags and the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git ls-remote --tags origin > "${RUNNER_TEMP}/tags"
          git fetch --tags --force origin
          gh api "repos/${REPO}/releases" --paginate --jq '.[].tag_name' > "${RUNNER_TEMP}/releases"

      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          plan="$(.github/scripts/release/plan.sh . "${RUNNER_TEMP}/tags" "${RUNNER_TEMP}/releases")"
          echo "$plan"
          echo "mode=$(jq -r .mode <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version <<< "$plan")" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            echo "mode: \`$(jq -r .mode <<< "$plan")\` — \`$(jq -r .version <<< "$plan")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # `finish` builds the existing tag; `release` builds the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.mode == 'finish' && needs.plan.outputs.version || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, not a literal: the `toolchain` line when present, else
          # the `go` directive, an exact patch version either way. A pinned
          # "1.26" resolves to 1.26.0 and stays there, keeping a toolchain with
          # open stdlib advisories.
          go-version-file: go.mod

      - name: The notes are present and the commit is on main
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error::$notes is missing or empty"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./tests/...

  release:
    name: release
    needs: [plan, verify]
    if: needs.plan.outputs.mode != 'none' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.mode == 'finish' && needs.plan.outputs.version || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The release asset of jedisct1/minisign, checked against a pinned digest.
      # Ubuntu's package lags the upstream release by years and changes with
      # the runner image; the tarball is the same bytes on every run. The digest
      # is of the asset whose minisign signature verifies under the author's
      # key RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3.
      - name: Install minisign
        working-directory: ${{ runner.temp }}
        env:
          MINISIGN_VERSION: "0.12"
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          set -euo pipefail
          archive="minisign-${MINISIGN_VERSION}-linux.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/${archive}"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p minisign-bin
          tar -xzf "$archive" --strip-components=2 -C minisign-bin minisign-linux/x86_64/minisign
          echo "${RUNNER_TEMP}/minisign-bin" >> "$GITHUB_PATH"

      # The key lives outside the work tree, so GoReleaser's dirty-tree check
      # never sees it, and it never reaches a command line or the log. The
      # secret is accepted with or without a trailing newline; the file always
      # ends in exactly one, as minisign writes it.
      - name: Write the signing key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$MINISIGN_KEY" ]]; then
            echo "::error::the MINISIGN_KEY secret of the release environment is not set"
            exit 1
          fi
          key_file="${RUNNER_TEMP}/minisign.key"
          key="${MINISIGN_KEY//$'\r'/}"
          while [[ "$key" == *$'\n' ]]; do key="${key%$'\n'}"; done
          (umask 077 && printf '%s\n' "$key" > "$key_file")
          echo "MINISIGN_KEY_FILE=${key_file}" >> "$GITHUB_ENV"

      # gt update trusts internal/selfupdate/minisign.pub alone, so a release
      # signed by any other key is one no installed gt accepts. A secret that
      # does not match the committed public key fails here, before anything is
      # tagged or published. stdin is closed, so an encrypted key fails on its
      # password prompt instead of waiting for one.
      - name: The signing key matches minisign.pub
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/minisign-probe"
          printf 'gt release %s\n' "$VERSION" > "$probe"
          minisign -S -s "$MINISIGN_KEY_FILE" -m "$probe" -x "${probe}.minisig" < /dev/null
          if ! minisign -V -p internal/selfupdate/minisign.pub -m "$probe" -x "${probe}.minisig"; then
            echo "::error::MINISIGN_KEY does not match internal/selfupdate/minisign.pub"
            exit 1
          fi

      # An unsigned annotated tag made as github-actions[bot]; its message
      # names this run. Rejected when the tag already exists, which means a
      # concurrent run made it, and the next sweep no longer sees it pending.
      - name: Push the tag
        if: env.MODE == 'release'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release ${VERSION}" -m "$RUN_URL"
          git push origin "refs/tags/${VERSION}"

      # A release that exists is not rebuilt, so re-running after a partial run
      # finishes the work instead of failing on what is already there.
      - name: GitHub Release exists
        id: exists
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GoReleaser
        if: steps.exists.outputs.present != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --release-notes=docs/releases/${{ needs.plan.outputs.version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete the signing key
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/minisign.key"

      # Governed repositories pin gt's reusable workflows to a moving major tag
      # (v1, v2, ...) rather than a SHA, so gate and sync logic reaches them
      # without editing any file, which matters because GITHUB_TOKEN cannot
      # write .github/workflows/**.
      #
      # This step is load-bearing. If it is skipped, every governed repository
      # freezes on the old logic with no drift signal: their caller files are
      # still byte-identical, so `gt repo check` reports compliant. It verifies
      # the move rather than assuming it worked, and it runs on a finished
      # release too, so a run that failed here is repaired by the next sweep.
      - name: Move the major version tag
        run: |
          set -euo pipefail

          major="${VERSION%%.*}"   # v1.2.3 -> v1
          if [[ ! "$major" =~ ^v[0-9]+$ ]]; then
            echo "::error::could not derive a major tag from ${VERSION}"
            exit 1
          fi

          target="$(git rev-parse "${VERSION}^{commit}")"
          echo "Moving ${major} -> ${VERSION} (${target:0:7})"
          git tag -f "$major" "$target"
          git push --force origin "refs/tags/${major}"

          # Confirm the remote actually advanced; a silent no-op here is the
          # failure mode this whole step exists to prevent.
          remote_sha="$(git ls-remote origin "refs/tags/${major}" | cut -f1)"
          if [[ "$remote_sha" != "$target" ]]; then
            echo "::error::${major} did not advance on the remote (got ${remote_sha}, want ${target})"
            exit 1
          fi
          echo "Released [${VERSION}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}); ${major} now points at it." >> "$GITHUB_STEP_SUMMARY"
