name: gt gate

# Reusable PR gate for repositories governed by `gt repo`.
#
# Consumers call this from a thin caller that gt renders, pinned to the moving
# major tag (@v0). That indirection is what lets this logic change without
# editing a single consumer repo — which matters because GITHUB_TOKEN cannot
# write .github/workflows/**, so a workflow that had to be rewritten on every
# policy change could never self-update.
#
# The `Gate` job is the single required status check. Consumers configure
# exactly "PR / Gate" in branch protection and never touch it again: the caller
# job is named PR, this job is named Gate, and reusable workflows report as
# "<caller job> / <called job>".
#
# Aggregation differs from the in-workflow pattern (wardnet's
# `all-checks-passed`) because a reusable workflow cannot `needs:` into the
# consumer's own ci.yml. Instead Gate polls the PR's checks. The conclusion
# semantics are identical: success/skipped/neutral pass, failure/cancelled/
# timed_out fail. Skipped passing is deliberate — it avoids the gated-leaf trap
# where a legitimately skipped job never reports and blocks the PR forever.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  config:
    name: Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cc_enabled: ${{ steps.spec.outputs.cc_enabled }}
      cc_title: ${{ steps.spec.outputs.cc_title }}
      cc_commits: ${{ steps.spec.outputs.cc_commits }}
      cc_types: ${{ steps.spec.outputs.cc_types }}
      cc_scopes: ${{ steps.spec.outputs.cc_scopes }}
      timeout_minutes: ${{ steps.spec.outputs.timeout_minutes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gt
        run: curl -fsSL https://raw.githubusercontent.com/pedromvgomes/gt/main/install.sh | sh

      - name: Read config
        id: spec
        run: |
          set -euo pipefail

          # Config comes from gt, not from parsing the YAML here. Re-deriving
          # gt's defaults in yq produced three separate bugs: `//` is the
          # ALTERNATIVE operator, so an explicit `false` reads back as the
          # default (silently re-enabling a check the repo turned off), and a
          # key gt defaults in Go had no fallback in the workflow at all.
          # `gt repo config --json` is the same parser, defaults and validation
          # the local commands use.
          gt repo config --json > "${RUNNER_TEMP}/spec.json"

          enabled=$(jq -r '.conventional_commits.enabled' "${RUNNER_TEMP}/spec.json")
          scope=$(jq -r '.conventional_commits.scope' "${RUNNER_TEMP}/spec.json")

          title=false
          commits=false
          if [[ "$enabled" == "true" ]]; then
            case "$scope" in
              pr_title) title=true ;;
              commits)  commits=true ;;
              both)     title=true; commits=true ;;
              *) echo "::error::conventional_commits.scope=$scope is not one of pr_title, commits, both"; exit 1 ;;
            esac
          fi

          {
            echo "cc_enabled=$enabled"
            echo "cc_title=$title"
            echo "cc_commits=$commits"
            echo "timeout_minutes=$(jq -r '.checks.timeout_minutes' "${RUNNER_TEMP}/spec.json")"
          } >> "$GITHUB_OUTPUT"

          # types and scopes are newline-separated lists. A multiline value
          # MUST use the heredoc form: writing it as `key=value` fails the step
          # with "Invalid format", which would break the gate on every PR.
          {
            echo "cc_types<<GT_EOF"
            jq -r '.conventional_commits.types[]?' "${RUNNER_TEMP}/spec.json"
            echo "GT_EOF"
            echo "cc_scopes<<GT_EOF"
            jq -r '.conventional_commits.scopes[]?' "${RUNNER_TEMP}/spec.json"
            echo "GT_EOF"
          } >> "$GITHUB_OUTPUT"

  conventional-commits:
    name: Conventional commits
    needs: config
    if: needs.config.outputs.cc_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # With squash merge (which gt enforces) the PR title becomes the commit
      # subject on the default branch, so linting the title is what actually
      # keeps history conventional.
      #
      # Implemented here rather than with action-semantic-pull-request because
      # of two behaviours that action does not offer, both adopted from
      # tumika's pr-title.yml:
      #
      #   - Case-insensitive type matching. The spec says "The units of
      #     information that make up Conventional Commits MUST NOT be treated
      #     as case sensitive by implementors, with the exception of BREAKING
      #     CHANGE". Rejecting `Feat:` is local house style, not the standard.
      #   - Accepting GitHub's `Revert "…"` titles. A revert is usually urgent,
      #     and making someone edit a title mid-incident is the wrong trade.
      #
      # Dropping the action also removes a third-party SHA pin to maintain.
      - name: Check PR title
        if: needs.config.outputs.cc_title == 'true'
        env:
          # Through the environment, never interpolated into the script: a PR
          # title is attacker-controlled text, and `${{ }}` inside `run:` would
          # splice it straight into the shell.
          TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ needs.config.outputs.cc_types }}
          SCOPES: ${{ needs.config.outputs.cc_scopes }}
        run: |
          set -euo pipefail

          types=$(printf '%s' "$TYPES" | tr '\n' '|' | sed 's/|$//')
          if [[ -z "$types" ]]; then
            echo "::error::conventional_commits.types is empty"
            exit 1
          fi

          # GitHub's "Revert" button generates `Revert "<original title>"`.
          if printf '%s' "$TITLE" | grep -Eqi '^Revert "'; then
            echo "✅ revert PR title accepted: $TITLE"
            exit 0
          fi

          # An empty scopes list means any scope is allowed.
          scope_pattern='(\([a-zA-Z0-9][a-zA-Z0-9._/-]*\))?'
          if [[ -n "${SCOPES//[$'\n']/}" ]]; then
            scopes=$(printf '%s' "$SCOPES" | tr '\n' '|' | sed 's/|$//')
            scope_pattern="(\((${scopes})\))?"
          fi

          # Conventional Commits 1.0.0: <type>[(scope)][!]: <description>
          pattern="^(${types})${scope_pattern}!?: .+"

          if printf '%s' "$TITLE" | grep -Eqi "$pattern"; then
            echo "✅ $TITLE"
            exit 0
          fi

          cat >&2 <<MSG
          ❌ The pull request title is not a Conventional Commit.

             Title: $TITLE

          Pull requests here are squash-merged, so this title becomes the commit
          message on the default branch — it is the history, not a label.

             <type>[(scope)][!]: <description>

          Types:  ${types//|/ }
          Scope:  optional, the package or layer — fix(logging): …
          Break:  feat(api)!: …  plus a BREAKING CHANGE: footer

          Configured in .gt-repo.yaml under conventional_commits.
          See https://www.conventionalcommits.org/en/v1.0.0/
          MSG
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.config.outputs.cc_commits == 'true'
        with:
          fetch-depth: 0

      # Only meaningful for repos that preserve individual commits. Under
      # squash merge the subjects never reach the default branch.
      - name: Check commit subjects
        if: needs.config.outputs.cc_commits == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TYPES: ${{ needs.config.outputs.cc_types }}
        run: |
          set -euo pipefail

          types=$(printf '%s' "$TYPES" | tr '\n' '|' | sed 's/|$//')
          if [[ -z "$types" ]]; then
            echo "::error::conventional_commits.types is empty"
            exit 1
          fi
          # type(optional-scope)!: subject — matched case-insensitively below,
          # for the same spec reason as the title check.
          pattern="^(${types})(\([^)]+\))?!?: .+"

          failed=0
          while read -r sha; do
            [[ -z "$sha" ]] && continue
            subject=$(git log -1 --format=%s "$sha")
            # Merge commits are generated by GitHub, not authored, so holding
            # them to the convention would fail PRs for updating their branch.
            if [[ $(git rev-list --parents -n 1 "$sha" | wc -w) -gt 2 ]]; then
              echo "  skip (merge): $subject"
              continue
            fi
            if printf '%s' "$subject" | grep -Eqi '^Revert "'; then
              echo "  ok (revert): $subject"
            elif printf '%s' "$subject" | grep -Eqi "$pattern"; then
              echo "  ok:   $subject"
            else
              echo "::error::not a conventional commit subject: $subject"
              failed=1
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [[ "$failed" -ne 0 ]]; then
            echo "Expected: <type>(<scope>): <subject>, with type one of: ${types//|/, }"
            exit 1
          fi

  governance:
    name: Governance
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gt
        run: curl -fsSL https://raw.githubusercontent.com/pedromvgomes/gt/main/install.sh | sh

      # Catches drift at the point it would be introduced, rather than waiting
      # for the weekly sync to notice and open a PR reverting it.
      - name: Check governance
        run: gt repo check

  Gate:
    name: Gate
    needs: [config, conventional-commits, governance]
    if: always()
    runs-on: ubuntu-latest
    # Bounded by the polling loop's own deadline; this is the outer backstop.
    timeout-minutes: 360
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read # `gh pr checks` needs this to see the PR's results
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Same rule as wardnet's all-checks-passed: a skipped dependency is fine
      # (it was legitimately gated off), a failed or cancelled one is not.
      - name: Verify gate jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "gate job results: ${RESULTS}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::a gate job failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::a gate job was cancelled"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gt
        run: curl -fsSL https://raw.githubusercontent.com/pedromvgomes/gt/main/install.sh | sh

      - name: Aggregate declared checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TIMEOUT_MINUTES: ${{ needs.config.outputs.timeout_minutes }}
          SELF: ${{ github.job }}
        run: |
          set -euo pipefail

          # Same reasoning as the config job: read gt's resolved spec rather
          # than re-parsing the YAML with a different set of defaults.
          gt repo config --json > "${RUNNER_TEMP}/spec.json"
          mapfile -t required < <(jq -r '.checks.required[]?' "${RUNNER_TEMP}/spec.json")
          mapfile -t optional < <(jq -r '.checks.optional[]?' "${RUNNER_TEMP}/spec.json")

          if [[ ${#required[@]} -eq 0 && ${#optional[@]} -eq 0 ]]; then
            echo "No checks declared in .gt-repo.yaml; nothing to aggregate."
            exit 0
          fi

          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          interval=15

          # `gh pr checks` merges check runs and commit statuses, so tools that
          # post either form are visible. It exits non-zero while anything is
          # pending or failing, hence the `|| true`.
          snapshot() {
            gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,state 2>/dev/null || true
          }

          # A conclusion of skipped or neutral counts as a pass, matching the
          # in-workflow aggregator this replaces.
          is_pass()    { [[ "$1" == "SUCCESS" || "$1" == "SKIPPED" || "$1" == "NEUTRAL" ]]; }
          is_failure() { [[ "$1" == "FAILURE" || "$1" == "CANCELLED" || "$1" == "TIMED_OUT" || "$1" == "ACTION_REQUIRED" || "$1" == "STARTUP_FAILURE" ]]; }

          while :; do
            checks=$(snapshot)

            pending=()
            failed=()

            for name in "${required[@]}" "${optional[@]}"; do
              [[ -z "$name" ]] && continue
              optional_check=false
              for o in "${optional[@]:-}"; do
                [[ "$name" == "$o" ]] && optional_check=true && break
              done

              state=$(printf '%s' "$checks" | jq -r --arg n "$name" '
                [ .[] | select(.name == $n) ] as $m
                | if ($m | length) == 0 then "ABSENT"
                  elif ($m | map(select(.state == "FAILURE" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED" or .state == "STARTUP_FAILURE")) | length) > 0 then
                    ($m | map(select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL")) | .[0].state)
                  elif ($m | map(select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS" or .state == "WAITING" or .state == "REQUESTED")) | length) > 0 then "PENDING"
                  else "SUCCESS" end')

              # An optional check never blocks the merge, whatever it reports.
              # "Optional" has to mean optional in every outcome, not only when
              # the check is absent — the auto-merge job already treats
              # UNSTABLE (required green, optional red) as mergeable, and the
              # two must agree or a PR would auto-merge past a gate it failed.
              if [[ "$optional_check" == "true" ]]; then
                if is_failure "$state"; then
                  echo "::warning::optional check ${name} reported ${state}; not blocking"
                elif ! is_pass "$state" && [[ "$state" != "ABSENT" ]]; then
                  # Still running: wait, so a slow optional check is observed
                  # rather than silently ignored.
                  pending+=("$name ($state, optional)")
                fi
                continue
              fi

              if is_failure "$state"; then
                failed+=("$name ($state)")
              elif is_pass "$state"; then
                :
              else
                # ABSENT is indistinguishable from "not started yet", so a
                # required check stays pending until the deadline. That is
                # exactly what `gt repo check`'s trigger lint exists to prevent.
                [[ "$state" == "ABSENT" ]] && state="absent"
                pending+=("$name ($state)")
              fi
            done

            if [[ ${#failed[@]} -gt 0 ]]; then
              printf '::error::required check failed: %s\n' "${failed[@]}"
              exit 1
            fi
            if [[ ${#pending[@]} -eq 0 ]]; then
              echo "All declared checks concluded successfully."
              break
            fi
            if [[ $(date +%s) -ge $deadline ]]; then
              printf '::error::timed out after %s minutes waiting for: %s\n' "$TIMEOUT_MINUTES" "${pending[@]}"
              echo "If a check never appears, its workflow may not run on pull_request or may be filtered by paths:."
              echo "Run 'gt repo check' locally — the trigger lint reports exactly this."
              exit 1
            fi

            printf 'waiting on: %s\n' "${pending[@]}"
            sleep "$interval"
          done

      - name: Summary
        if: always()
        run: echo "Gate complete." >> "$GITHUB_STEP_SUMMARY"
